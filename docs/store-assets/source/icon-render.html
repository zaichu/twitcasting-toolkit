<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icon render</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c1f2a;
      }

      img {
        display: block;
        width: 128px;
        height: 128px;
      }
    </style>
  </head>
  <body>
    <img src="../../../public/icons/icon.svg" alt="" />
    <script>
      const size = Number(new URLSearchParams(window.location.search).get("size") ?? 128);
      const image = document.querySelector("img");
      image.style.width = `${size}px`;
      image.style.height = `${size}px`;
    </script>
  </body>
</html>
