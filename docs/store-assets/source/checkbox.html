<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, initial-scale=1" />
    <title>TwitCasting Toolkit checkbox screenshot</title>
    <link rel="stylesheet" href="./store-screenshots.css" />
  </head>
  <body>
    <main class="store-frame">
      <section class="copy">
        <div class="brand-row">
          <img src="../../../public/icons/icon.svg" alt="" />
          <span>TwitCasting Toolkit</span>
        </div>
        <h1>チェックボックスを一括で整える。</h1>
        <p class="lead">
          現在ページの選択状態を数値で確認し、全選択、全解除、反転をすばやく実行。
          ホスト別の自動適用も保存できます。
        </p>
        <div class="metric-strip">
          <div><span>合計</span><strong>42</strong></div>
          <div><span>選択中</span><strong>31</strong></div>
          <div><span>無効</span><strong>2</strong></div>
        </div>
      </section>

      <section class="mock-browser" aria-hidden="true">
        <div class="mock-bar">
          <span class="mock-dot"></span>
          <span class="mock-dot"></span>
          <span class="mock-dot"></span>
          <span class="mock-url">twitcasting.tv/settings</span>
        </div>
        <div class="mock-content">
          <span class="mock-line mid"></span>
          <div class="mock-grid">
            <span class="mock-card"></span>
            <span class="mock-card"></span>
            <span class="mock-card"></span>
          </div>
          <span class="mock-line short"></span>
        </div>
      </section>

      <aside class="popup-card">
        <div class="popup-inner">
          <header class="popup-header">
            <img src="../../../public/icons/icon.svg" alt="" />
            <div class="popup-title">
              <strong>TwitCasting Toolkit</strong>
              <span>twitcasting.tv</span>
            </div>
          </header>

          <nav class="tabs">
            <span class="tab selected">チェック</span>
            <span class="tab">アイテム</span>
          </nav>

          <div class="stats-grid">
            <div class="stat"><span>合計</span><strong>42</strong></div>
            <div class="stat"><span>選択中</span><strong>31</strong></div>
            <div class="stat"><span>無効</span><strong>2</strong></div>
          </div>

          <p class="status">31 / 42 件選択中</p>

          <div class="actions">
            <span class="primary-button">全選択</span>
            <span class="soft-button">全解除</span>
            <span class="soft-button">反転</span>
          </div>

          <div class="rule-panel">
            <div class="switch-row">
              <span>
                <strong>このホストで自動適用</strong>
                <small>読み込み時に全選択</small>
              </span>
              <span class="toggle"></span>
            </div>
            <nav class="tabs">
              <span class="tab selected">選択</span>
              <span class="tab">解除</span>
            </nav>
          </div>
        </div>
      </aside>
    </main>
  </body>
</html>
