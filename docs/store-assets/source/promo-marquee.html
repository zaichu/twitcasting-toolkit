<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1400, initial-scale=1" />
    <title>TwitCasting Toolkit marquee promo tile</title>
    <link rel="stylesheet" href="./promo-tiles.css" />
  </head>
  <body>
    <main class="promo promo-marquee">
      <section class="copy">
        <div class="mark-row">
          <img src="../../../public/icons/icon.svg" alt="" />
          <div>
            <strong>TwitCasting Toolkit</strong>
            <span>Chrome extension for TwitCasting</span>
          </div>
        </div>
        <h1>TwitCasting の操作を、popup からすばやく。</h1>
        <p class="lead">
          チェックボックスの一括操作、アイテム候補の確認、ポイント情報の表示を
          TwitCasting のページだけで実行できます。
        </p>
        <div class="feature-strip">
          <span>チェック一括操作</span>
          <span>アイテム候補を検出</span>
          <span>最大 20 回まで</span>
          <span>TwitCasting のみ</span>
        </div>
      </section>

      <section class="product-panel" aria-hidden="true">
        <div class="browser-card">
          <div class="browser-bar">
            <i></i>
            <i></i>
            <i></i>
          </div>
          <div class="browser-body">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>

        <aside class="mini-popup">
          <div class="mini-head">
            <img src="../../../public/icons/icon.svg" alt="" />
            <div>
              <strong>TwitCasting Toolkit</strong>
              <span>twitcasting.tv</span>
            </div>
          </div>
          <div class="mini-tabs">
            <span>チェック</span>
            <span>アイテム</span>
          </div>
          <div class="mini-items">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="mini-button">実行</div>
        </aside>
      </section>
    </main>
  </body>
</html>
