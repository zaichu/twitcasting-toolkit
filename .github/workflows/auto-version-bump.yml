name: Auto Version Bump

on:
  pull_request:
    types:
      - closed
    branches:
      - main

# 複数 PR がほぼ同時にマージされても version bump が競合しないよう、
# このワークフローは常に直列実行する(同時に走らせず、順番に待たせる)。
concurrency:
  group: version-bump-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump-version:
    name: Bump Version on Merge
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and push directly to main
        run: |
          set -e

          # concurrency で直列化されているため通常は1回で成功するはずだが、
          # 手動pushなど想定外の割り込みに備えてリトライも入れておく。
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            npm version patch --no-git-tag-version
            VERSION="$(node -p "require('./package.json').version")"
            node -e "
              const fs = require('fs');
              const path = 'public/manifest.json';
              const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
              manifest.version = process.argv[1];
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
            " "$VERSION"

            git add package.json package-lock.json public/manifest.json
            git commit -m "chore: バージョンを${VERSION}に更新"

            if git push origin HEAD:main; then
              echo "Pushed version ${VERSION}"
              exit 0
            fi

            echo "Push failed (attempt ${attempt}/5), retrying after backoff..."
            sleep $((attempt * 5))
          done

          echo "::error::Failed to push version bump after retries"
          exit 1
